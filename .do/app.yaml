name: soar-studio
region: nyc
domains:
  - domain: soar.studio
    type: PRIMARY
  - domain: www.soar.studio
    type: ALIAS
static_sites:
  - name: soar-studio-site
    source_dir: public
    github:
      repo: soar-studio/Soar-Studio-Website-
      branch: main
      deploy_on_push: true
    output_dir: /
    index_document: index.html
    error_document: index.html
    catchall_document: index.html
    routes:
      - path: /
    envs: []
